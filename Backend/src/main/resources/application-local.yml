spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: REEMPLAZA_CON_CLIENT_ID_REAL.apps.googleusercontent.com
            client-secret: REEMPLAZA_CON_CLIENT_SECRET_REAL
            scope:
              - openid
              - profile
              - email

app:
  oauth2:
    authorizedRedirectUris:
      - http://localhost:5173/oauth2/redirect

# Perfil local para desarrollo rápido sin variables de entorno.
# NO subir credenciales reales a git. Sustituye los valores arriba sólo en tu máquina.
# Ejecuta con:
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
# O en PowerShell:
#   $Env:SPRING_PROFILES_ACTIVE="local"; mvn spring-boot:run
